[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumplot"
version = "0.1.0a2"
description = "Backend-neutral Grammar-of-Graphics semantics and PlotSpec for SUM."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "William Martinez Bas", email = "metfar@gmail.com" }]
dependencies = ['sumcore>=0.1.0a2', 'sumui>=0.1.0a11']
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.scripts]
sumplot = "sumplot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sumplot*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.7"]
seaborn = ["matplotlib>=3.7", "seaborn>=0.13"]
charts = ["matplotlib>=3.7", "seaborn>=0.13"]
